name: Checks

# Comprobaciones reutilizables (workflow_call): las llaman ci.yml (pull requests), deploy.yml
# (push a master, antes de construir la imagen) y release.yml (tags vX.Y.Z).
#   secrets → gitleaks sobre todo el historial
#   build   → checkstyle (validate) + tests unitarios (surefire) + tests de integración (failsafe,
#             MariaDB real vía Testcontainers en el docker del runner) = `mvn verify`
#
# Actions fijadas por SHA de commit (el tag es un comentario); Dependabot las actualiza.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Ningún secreto llega al historial: gitleaks sobre todo el repo (binario oficial vía docker;
  # la action de gitleaks exige licencia en organizaciones, el binario no).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact -v --exit-code 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = checkstyle + unit (surefire) + integración (failsafe: arranca mariadb:10.11 con
      # Testcontainers; el runner de GitHub trae docker). Si falla, la cola del log sale como
      # anotación del check (visible sin permisos de admin).
      - name: mvn verify
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress verify 2>&1 | tee mvn.log || {
            printf '::error title=mvn verify::%s\n' "$(grep -E 'ERROR|FAIL|Tests run:.*Failures: [1-9]' mvn.log | tail -c 3500 | tr '\n' '\r' | sed 's/\r/%0A/g')"
            exit 1
          }
      - name: Informes de tests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7
