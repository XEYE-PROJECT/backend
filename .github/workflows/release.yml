name: Release

# Tag vX.Y.Z (creado por `bash release.sh X.Y.Z` y empujado con `git push origin master --tags`):
# checks → imagen ghcr.io/xeye-project/backend:vX.Y.Z (y :sha) → GitHub Release con la sección
# de esa versión del CHANGELOG.md como notas. Desplegar una versión: `deploy.sh xeye-backend vX.Y.Z`.
#
# Actions fijadas por SHA de commit (el tag es un comentario); Dependabot las actualiza.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/xeye-project/backend

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validar el tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag no semver: $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Notas desde CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md no tiene la sección [${GITHUB_REF_NAME#v}]"; exit 1; }
          printf '\nImagen: `%s:%s`\n' "$IMAGE" "$GITHUB_REF_NAME" >> notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
