# Configuración de gitleaks (CI y pre-commit). Hereda las reglas por defecto y solo añade
# allowlists de rutas que contienen ejemplos, nunca secretos reales.
[extend]
useDefault = true

[allowlist]
description = "Rutas con ejemplos y vectores de prueba, nunca secretos reales"
paths = [
  # Skills de Claude: ejemplos de curl con tokens ficticios.
  '''\.claude/skills/.*''',
  # Fixtures de contrato entre servicios: hashes de ejemplo y el token de webhook derivado del
  # secreto de los tests de integración (it-webhook-secret…), que solo existe en los tests.
  '''src/test/resources/contracts/.*''',
  # Vector de prueba del RFC 6238 (secreto TOTP público del propio RFC).
  '''src/test/java/com/xeye/backend/shared/security/TotpTest\.java''',
]
