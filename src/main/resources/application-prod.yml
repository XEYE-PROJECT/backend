# Perfil prod: sin ningún default de secretos (los exige application.yml) y con
# ProductionConfigGuard comprobando al arrancar que no queda ningún valor de desarrollo.
spring:
  jpa:
    show-sql: false

server:
  # Caddy termina TLS y manda X-Forwarded-*: así la app sabe que la petición es https.
  forward-headers-strategy: native
  error:
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.xeye.backend: INFO
  # Logs en JSON (Elastic Common Schema: una línea por evento con @timestamp, log.level,
  # message, el MDC —requestId— y la traza) para el recolector de logs del stack de
  # monitorización. LOG_STRUCTURED_FORMAT=ecs|logstash|gelf; vacío = texto plano.
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}
