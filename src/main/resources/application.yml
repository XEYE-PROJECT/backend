# Configuración base, común a todo entorno. Los valores que dependen del entorno (secretos,
# BD, proveedores, orígenes CORS) NO tienen default aquí a propósito: un placeholder sin
# variable de entorno aborta el arranque ("Could not resolve placeholder 'JWT_SECRET'"), que
# es lo seguro. Los defaults de desarrollo viven en application-dev.yml.
#
# Tampoco hay perfil por defecto: hay que activar `dev` o `prod` explícitamente
# (`mvn spring-boot:run` activa dev vía pom.xml; docker-compose.dev.yml fija dev; la imagen
# de producción fija prod en su Dockerfile). Sin perfil, la app no arranca.
spring:
  application:
    name: xeye-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # El esquema es de Flyway. Hibernate nunca toca el DDL.
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  # SMTP (solo con EMAIL_PROVIDER=smtp). IONOS: smtp.ionos.es, 587 STARTTLS, usuario = buzón completo.
  mail:
    host: ${SMTP_HOST:smtp.ionos.es}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8000}

# Actuator: solo /actuator/health y sin detalles (el proxy bloquea el resto de /actuator/*).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # El starter de mail añadiría un indicador que abre una conexión SMTP en cada health check
    # (y pondría el servicio DOWN si IONOS no responde): el email no es crítico para servir tráfico.
    mail:
      enabled: false

# Sentry: desactivado si SENTRY_DSN está vacío (dev no necesita nada). Solo errores
# (sin tracing); los logs a nivel ERROR se convierten en eventos vía logback.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  traces-sample-rate: 0.0
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

# ---- Configuración propia de la aplicación (ver com.xeye.backend.shared.config) ----
xeye:
  jwt:
    # >= 32 bytes (HS256). Generar con: openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    issuer: xeye-backend
  cors:
    # Orígenes exactos del frontend, separados por comas (allowCredentials: sin comodines).
    allowed-origins: ${CORS_ORIGINS}
  auth:
    # URL pública de la consola: enlaces de los emails (verificación, recuperación) y retorno del SSO.
    frontend-url: ${FRONTEND_URL}
    # false = las cuentas nuevas pueden iniciar sesión sin verificar el email (solo dev/pruebas).
    require-email-verification: ${AUTH_REQUIRE_EMAIL_VERIFICATION:true}
    # Emails (separados por comas) que se promocionan a admin al iniciar sesión: bootstrap del primer admin.
    admin-emails: ${ADMIN_EMAILS:}
    # Nombre que muestran las apps de 2FA (Google Authenticator, 1Password…).
    mfa-issuer: ${MFA_ISSUER:XEYE}
    # Días que un dispositivo "recordado" tras el 2FA no vuelve a pedir el código (0 = pedirlo siempre).
    mfa-trust-days: ${MFA_TRUST_DAYS:30}
    rate-limit:
      # Peticiones por minuto y por IP a los endpoints públicos de auth; <= 0 desactiva.
      login-per-minute: ${AUTH_RATE_LOGIN_PER_MINUTE:10}
      register-per-minute: ${AUTH_RATE_REGISTER_PER_MINUTE:5}
      password-reset-per-minute: ${AUTH_RATE_PASSWORD_RESET_PER_MINUTE:5}
    captcha:
      # none | turnstile (Cloudflare Turnstile: site key pública para la consola + secret para verificar).
      provider: ${CAPTCHA_PROVIDER:none}
      site-key: ${CAPTCHA_SITE_KEY:}
      secret: ${CAPTCHA_SECRET:}
    password:
      # hibp = Have I Been Pwned (k-anonimato, falla abierto si no hay red) | none.
      breach-check: ${PASSWORD_BREACH_CHECK:hibp}
    sso:
      # Un proveedor se activa cuando tiene client id + secret. Redirect URI a registrar en el
      # proveedor: {BACKEND_URL}/auth/sso/{google|microsoft}/callback
      google:
        client-id: ${SSO_GOOGLE_CLIENT_ID:}
        client-secret: ${SSO_GOOGLE_CLIENT_SECRET:}
      microsoft:
        client-id: ${SSO_MICROSOFT_CLIENT_ID:}
        client-secret: ${SSO_MICROSOFT_CLIENT_SECRET:}
        # common (cualquier cuenta), organizations, consumers o un tenant id concreto.
        tenant: ${SSO_MICROSOFT_TENANT:common}
  email:
    # log (imprime el email y sus enlaces en el log; dev) | smtp (buzón IONOS, ver spring.mail.*
    # más abajo) | resend (API de Resend).
    provider: ${EMAIL_PROVIDER}
    # Remitente: debe ser un buzón del dominio autorizado por el proveedor (noreply@xeye.es en IONOS).
    from: ${EMAIL_FROM:XEYE <noreply@xeye.es>}
    # Buzón que recibe las respuestas de los usuarios.
    reply-to: ${EMAIL_REPLY_TO:info@xeye.es}
    resend-api-key: ${RESEND_API_KEY:}
  training:
    # Cómo se ejecuta un training. Todos los providers reciben el mismo payload y responden por
    # el mismo webhook — solo cambia *dónde* corre el contenedor.
    #   mock   -> simula la finalización en el propio proceso (solo dev)
    #   docker -> un contenedor local por training (`docker run`, imagen del training-service)
    #   runpod -> POST del job a un endpoint Serverless de RunPod (GPU: el montaje con LLM local)
    provider: ${TRAINING_PROVIDER}
    # Secreto de la cabecera X-Webhook-Token del callback del worker. El worker lo recibe por
    # su entorno (WEBHOOK_SECRET), nunca dentro del payload del job.
    webhook-secret: ${TRAINING_WEBHOOK_SECRET}
    # Modelos ofrecidos al lanzar un training pendiente (el primero = por defecto). Tanto el
    # worker de training como el search-service deben poder cargar cada nombre listado aquí.
    embedding-models: ${TRAINING_EMBEDDING_MODELS:paraphrase-multilingual-MiniLM-L12-v2,paraphrase-multilingual-mpnet-base-v2}
    # URL base pública a la que el worker llama de vuelta (…/webhooks/training-update).
    # Desde dentro de un contenedor no es localhost: usar http://xeye-java-backend:8000
    # (misma red docker) o http://host.docker.internal:8000.
    callback-base-url: ${BACKEND_URL}
    mock-delay-ms: ${TRAINING_MOCK_DELAY_MS:500}
    # Un training lanzado sin actualización del webhook en este tiempo se marca fallido y su
    # lista vuelve a pending (worker muerto / callback perdido). 0 desactiva el barrido.
    stalled-after-minutes: ${TRAINING_STALLED_AFTER_MINUTES:30}
    # Máximo de trainings corriendo a la vez en todo el backend
    max-concurrent: ${TRAINING_MAX_CONCURRENT:1}
    # Precio preestablecido de un entrenamiento, en EUR: fijo + por descripción LLM a generar.
    # El por-descripción por defecto sale de facturación real de Gemini (tarifa Lote,
    # pensamiento incluido): 995 descripciones ~ 5,24 EUR -> ~0,0053 EUR/descripción.
    pricing:
      fixed: ${TRAINING_FIXED_PRICE:0.3}
      per-description: ${TRAINING_PRICE_PER_DESCRIPTION:0.0053}
    docker:
      image: ${TRAINING_DOCKER_IMAGE:xeye-training-service:latest}
      # Dónde escribimos el JSON del job, y ese mismo directorio tal como lo ve el daemon de
      # docker. Coinciden si el backend corre en el host; difieren si corre en un contenedor
      # (un bind mount siempre se resuelve en el host).
      input-dir: ${TRAINING_INPUT_DIR:/tmp/xeye-training}
      host-input-dir: ${TRAINING_HOST_INPUT_DIR:${TRAINING_INPUT_DIR:/tmp/xeye-training}}
      network: ${TRAINING_DOCKER_NETWORK:xeye-network}
      # Variables KEY=VALUE extra para el worker, p. ej. ENRICHER=groq,GROQ_API_KEY=...
      env: ${TRAINING_DOCKER_ENV:}
      # Valor de `docker run --gpus`: el worker usa la GPU siempre que puede. Si el daemon no
      # puede darla (sin NVIDIA container toolkit / sin dispositivo), el launcher reintenta en
      # CPU, así que "all" es seguro en cualquier máquina. Vacío fuerza CPU.
      gpus: ${TRAINING_DOCKER_GPUS:all}
      docker-binary: ${TRAINING_DOCKER_BINARY:docker}
    runpod:
      api-key: ${RUNPOD_API_KEY:}
      endpoint-id: ${RUNPOD_ENDPOINT_ID:}
      timeout-seconds: ${RUNPOD_TIMEOUT_SECONDS:30}
  search:
    # log -> solo loguea el payload (dev). http -> POST al microservicio de búsqueda.
    provider: ${SEARCH_PROVIDER}
    url: ${SEARCH_SERVICE_URL}
    internal-service-name: backend
    # Secreto compartido de las llamadas servidor-a-servidor backend<->search (ambas direcciones):
    # se envía en pushes/notificaciones y lo exige el filtro de /internal/** (SecurityConfig).
    internal-token: ${SEARCH_INTERNAL_TOKEN}
